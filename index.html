<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Theory Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Noto+Music&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF4; --surface:#FFFFFF; --surface2:#DCE2EE; --ink:#15203A; --muted:#56627E; --line:#C3CBDC;
  --brass:#9A6F0E; --brass-soft:#F2DFA8; --ok:#167F55; --ok-soft:#BFEBD5; --bad:#C23535; --bad-soft:#F6CFCF;
  --sel:#3157C8; --sel-soft:#C4D3F7; --on-brass:#FFFFFF; --ivory:#FBFAF6; --ebony:#1B1E26; --key-edge:#AEB6C6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424; --surface:#172038; --surface2:#222D4A; --ink:#E7EBF4; --muted:#9AA6C1; --line:#2E3A5C;
    --brass:#E5B84C; --brass-soft:#5A4714; --ok:#43C78F; --ok-soft:#1A4A36; --bad:#F27070; --bad-soft:#552026;
    --sel:#86A6F5; --sel-soft:#263E80; --on-brass:#1B1404; --ivory:#F2EFE6; --ebony:#07090D; --key-edge:#3A4566;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1424; --surface:#172038; --surface2:#222D4A; --ink:#E7EBF4; --muted:#9AA6C1; --line:#2E3A5C;
  --brass:#E5B84C; --brass-soft:#5A4714; --ok:#43C78F; --ok-soft:#1A4A36; --bad:#F27070; --bad-soft:#552026;
  --sel:#86A6F5; --sel-soft:#263E80; --on-brass:#1B1404; --ivory:#F2EFE6; --ebony:#07090D; --key-edge:#3A4566;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1,h2,h3{margin:0;line-height:1.15}
.muted{color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-weight:800;font-size:1.05rem;letter-spacing:-.01em}
.link{background:none;border:0;padding:8px 4px;color:var(--sel);font-weight:600;cursor:pointer}
.player{background:var(--surface);border-radius:18px;padding:18px;margin-bottom:16px}
.lvl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lvl .n{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.lvl .t{font-weight:600}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.bar>i{display:block;height:100%;background:var(--brass);border-radius:99px;transition:width .4s}
.bar.thin{height:6px;margin:8px 0 4px}
.bar.ok>i{background:var(--ok)}
.meta{display:flex;gap:16px;flex-wrap:wrap;font-size:.92rem;color:var(--muted)}
.meta b{color:var(--ink)}
.warm{margin:4px 0 22px}
.warm p{margin:0 0 8px;font-size:.9rem}
.section-h{font-size:1.15rem;font-weight:800;margin:6px 0 10px}
.topics{display:flex;flex-direction:column;gap:2px;border-radius:16px;overflow:hidden}
.trow{display:block;width:100%;text-align:left;background:var(--surface);border:0;padding:14px 16px;cursor:pointer}
.trow:hover{background:color-mix(in srgb,var(--surface) 88%,var(--sel))}
.trow .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.trow .name{font-weight:700;font-size:1.05rem}
.pips{display:flex;gap:4px}
.pips i{width:10px;height:10px;border-radius:50%;background:var(--surface2)}
.pips i.on{background:var(--brass)}
.pips i.cur{background:transparent;box-shadow:inset 0 0 0 2px var(--brass)}
.trow .sub{font-size:.9rem;color:var(--muted);margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--bg);min-height:46px}
.btn.wide{width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.brass{background:var(--brass);color:var(--on-brass)}
.btn:disabled{opacity:.4;cursor:default}
.mixrow{margin:14px 0 0}
/* topic view */
.back{background:none;border:0;padding:8px 0;font-weight:600;color:var(--muted);cursor:pointer}
.tv h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px}
.levels{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.lrow{background:var(--surface);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.lrow .info{flex:1;min-width:0}
.lrow .ln{font-weight:700}
.lrow.locked{opacity:.55}
.lrow .tag{font-size:.85rem;color:var(--muted)}
.lrow .btn{padding:10px 14px;min-height:40px}
.note{font-size:.88rem;color:var(--muted);margin-top:14px}
/* session */
.sbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.icon{background:var(--surface);border:0;width:40px;height:40px;border-radius:12px;cursor:pointer;font-size:1.05rem;flex:none}
.dots{flex:1;display:flex;gap:4px}
.dots i{flex:1;height:6px;border-radius:99px;background:var(--surface2)}
.dots i.ok{background:var(--ok)}.dots i.bad{background:var(--bad)}.dots i.now{background:var(--brass)}
.combo{font-weight:800;min-width:48px;text-align:right;color:var(--brass)}
.qcard{background:var(--surface);border-radius:18px;padding:18px 16px;margin-bottom:12px;min-height:150px}
.qmeta{font-size:.82rem;color:var(--muted);margin-bottom:4px}
.qcard h2{font-size:1.45rem;font-weight:800;letter-spacing:-.015em}
.qcard .sub{margin:4px 0 0;color:var(--muted);font-size:.93rem}
.staff{display:block;width:100%;max-width:340px;height:auto;margin:8px auto 0;color:var(--ink)}
.staff line{stroke:currentColor;stroke-width:1.2}
.staff .clef,.staff .acc{font-family:"Noto Music","Bravura Text","Segoe UI Symbol","Apple Symbols",serif;fill:currentColor}
.staff ellipse{fill:none;stroke:currentColor;stroke-width:2.6}
.playrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chips{display:flex;gap:5px;margin-top:14px;flex-wrap:wrap}
.chip{min-width:34px;height:40px;border-radius:10px;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;font-weight:700;padding:0 8px}
.chip.ok{background:var(--ok-soft)}.chip.want{background:var(--brass-soft)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.choice{background:var(--surface);border:0;border-radius:12px;padding:14px 10px;font-weight:700;cursor:pointer;min-height:54px;box-shadow:inset 0 0 0 1.5px var(--line)}
.choice.ok{background:var(--ok-soft);box-shadow:inset 0 0 0 2px var(--ok)}
.choice.bad{background:var(--bad-soft);box-shadow:inset 0 0 0 2px var(--bad)}
.fb{min-height:28px;font-weight:700;margin:2px 2px 8px}
.timer{display:flex;align-items:center;gap:10px;margin-top:14px}
.timer b{flex:1;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--brass);border-radius:99px}
.timer span{font-variant-numeric:tabular-nums;font-weight:700;min-width:52px;text-align:right}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.actions{display:flex;gap:8px;margin-bottom:12px}
.actions:empty{display:none}
/* keyboard */
.kb{position:relative;display:flex;height:160px;user-select:none;-webkit-user-select:none;touch-action:manipulation;padding-top:6px;border-top:6px solid var(--ink);border-radius:6px 6px 0 0}
.wk{flex:1;min-width:0;background:var(--ivory);border:1px solid var(--key-edge);border-top:0;border-radius:0 0 7px 7px;margin:0;padding:0 0 6px;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;font-size:.62rem;color:#6a7286;-webkit-tap-highlight-color:transparent}
.bk{position:absolute;top:6px;width:calc(100% / 15 * .62);height:58%;background:var(--ebony);border:0;border-radius:0 0 5px 5px;z-index:2;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;box-shadow:inset 0 -5px 0 rgba(255,255,255,.08)}
.wk.down{background:#E2DED3}.bk.down{background:#3a3f4c}
.wk.cue{background:#F0CF6E}.bk.cue{background:#B88A15}
.wk.want{background:#BFE9D3}.bk.want{background:#2E9C6B}
.wk.ok{background:#7FD6A9}.bk.ok{background:#178A5C}
.wk.bad{background:#F2A2A2}.bk.bad{background:#C23535}
.wk.sel{background:#AFC4F7}.bk.sel{background:#3157C8}
.kbwrap{margin:0 -8px}
/* results */
.res{text-align:center;padding:10px 0}
.res .big{font-size:4rem;font-weight:800;letter-spacing:-.04em;line-height:1}
.res .xp{font-weight:800;color:var(--brass);font-size:1.2rem;margin-top:6px}
.banner{background:var(--brass-soft);border-radius:14px;padding:14px 16px;margin:16px 0;text-align:left}
.banner b{display:block;font-size:1.05rem}
.box{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:14px}
.box h3{font-size:1rem;font-weight:800;margin-bottom:10px}
.stat{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;margin-bottom:10px}
.stat .bar{grid-column:1/-1;margin:2px 0 0}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px;overflow-x:auto}
.heat i{width:100%;aspect-ratio:1;min-width:14px;border-radius:3px;background:var(--surface2)}
.heat i.h1{background:color-mix(in srgb,var(--brass) 35%,var(--surface2))}
.heat i.h2{background:color-mix(in srgb,var(--brass) 60%,var(--surface2))}
.heat i.h3{background:color-mix(in srgb,var(--brass) 85%,var(--surface2))}
.heat i.h4{background:var(--brass)}
.weak{list-style:none;padding:0;margin:0}
.weak li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.weak li:last-child{border-bottom:0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.badge{border-radius:12px;padding:10px;background:var(--surface2);font-size:.88rem}
.badge .e{font-size:1.4rem;display:block}
.badge.off{opacity:.4;filter:grayscale(1)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:20;max-width:90vw;text-align:center;animation:pop .35s ease-out}
@keyframes pop{from{transform:translate(-50%,16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.sync{font-size:.8rem;color:var(--muted)}

.sym{display:block;width:100%;height:auto;color:var(--ink)}
.sym line{stroke:currentColor;stroke-width:1.1}
.sym .stem{stroke-width:1.5}
.sym .thick{stroke-width:2.8}
.sym .f{fill:currentColor;stroke:none}
.sym .h{fill:none;stroke:currentColor;stroke-width:2}
.sym path{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sym .pf{fill:currentColor;stroke:none}
.sym text{fill:currentColor}
.sym .dyn{font-family:"Times New Roman",Georgia,serif;font-style:italic;font-weight:700}
.sym .term{font-family:Georgia,"Times New Roman",serif;font-style:italic}
.sym .tempo{font-family:Georgia,"Times New Roman",serif;font-weight:700}
.sym .num{font-family:Georgia,"Times New Roman",serif;font-weight:800}
.sym .mus{font-family:"Noto Music","Bravura Text","Segoe UI Symbol","Apple Symbols",serif}
.sym .lbl{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700}
.sym .dash{stroke-dasharray:4 3}
.sym .mk{fill:transparent}
.sym .mk.ok{fill:var(--ok)}.sym .mk.bad{fill:var(--bad)}
.sym .gap{fill:var(--sel-soft);stroke:var(--sel);stroke-width:1.5;stroke-dasharray:4 3}
.symwrap{max-width:360px;margin:10px auto 0}
.symwrap.wide{max-width:none;overflow-x:auto}
.staff .hl{stroke:var(--sel);stroke-width:3.2}
.staff .hlt{fill:var(--sel)}
.staff .tie{fill:none;stroke:currentColor;stroke-width:1.8}
.staff text.par{font-family:Georgia,serif;font-size:20px;fill:currentColor}
.kbwrap.hide,.pad.hide{display:none}
.kbwrap.small .kb{height:76px}
.seg{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:12px}
.segb{flex:1;border:0;background:none;padding:10px 8px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--muted)}
.segb.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.inmode{background:var(--surface);border:0;border-radius:12px;height:40px;padding:0 10px;font-weight:700;font-size:.85rem;cursor:pointer;flex:none}
.midistat{font-size:.85rem;color:var(--muted);margin:8px 2px 0}
.midistat:empty{display:none}
.pad{width:100%;height:130px;border:0;border-radius:18px;background:var(--ink);color:var(--bg);font-size:1.4rem;font-weight:800;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.pad.hit{transform:scale(.985);background:var(--brass);color:var(--on-brass)}
.pad:disabled{opacity:.45}
.count{font-size:2.2rem;font-weight:800;text-align:center;min-height:44px;color:var(--brass)}
.choice{font-size:.95rem;line-height:1.25}
.sec-h{font-size:.95rem;font-weight:700;color:var(--muted);margin:18px 2px 8px}
.toplinks{display:flex;gap:4px}
.guide .gsec{background:var(--surface);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.guide h2{font-size:1.1rem;font-weight:800;margin-bottom:8px}
.grow{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:0}
.grow .sym{height:60px;max-width:none!important;margin:0}
.grow .gn{font-weight:700}
.grow .gm{color:var(--muted);font-size:.93rem}
.guide p{margin:6px 0;font-size:.95rem}
.qtext{font-size:1.05rem;margin-top:10px;font-weight:600}
</style>
</head>
<body>
<main id="app"></main>
<script>
// THEORY START
const LETTERS='CDEFGAB'.split('');
const NAT=[0,2,4,5,7,9,11];
const ACC={'-2':'𝄫','-1':'♭','0':'','1':'♯','2':'𝄪','n':'♮'};
const PC_LABEL=['C','C♯/D♭','D','D♯/E♭','E','F','F♯/G♭','G','G♯/A♭','A','A♯/B♭','B'];
const N=(l,a=0,o=4)=>({l,a,o});
const pc=n=>(((NAT[n.l]+n.a)%12)+12)%12;
const midiOf=n=>12*(n.o+1)+NAT[n.l]+n.a;
const nm=n=>LETTERS[n.l]+ACC[n.a];
const nmo=n=>nm(n)+n.o;
const stepOf=n=>n.l+7*n.o;
const fromStep=(st,a=0)=>N(((st%7)+7)%7,a,Math.floor(st/7));
const pretty=s=>s[0]+s.slice(1).replace(/#/g,'♯').replace(/b/g,'♭');
function parseN(s,o=4){const l=LETTERS.indexOf(s[0]);let a=0;for(const ch of s.slice(1)){if(ch==='#')a++;else if(ch==='b')a--;}return N(l,a,o);}
function spell(root,k,semi){const L=root.l+k;const l=L%7;const o=root.o+Math.floor(L/7);const target=midiOf(root)+semi;return N(l,target-(12*(o+1)+NAT[l]),o);}
const SCALES={major:{full:'major',iv:[0,2,4,5,7,9,11]},natural:{full:'natural minor',iv:[0,2,3,5,7,8,10]},harmonic:{full:'harmonic minor',iv:[0,2,3,5,7,8,11]},melodic:{full:'melodic minor',iv:[0,2,3,5,7,9,11]}};
const scaleNotes=(t,type)=>SCALES[type].iv.map((s,k)=>spell(t,k,s));
const Q={maj:{full:'major',iv:[0,4,7]},min:{full:'minor',iv:[0,3,7]},dim:{full:'diminished',iv:[0,3,6]},aug:{full:'augmented',iv:[0,4,8]},maj7:{full:'major 7th',iv:[0,4,7,11]},m7:{full:'minor 7th',iv:[0,3,7,10]},dom7:{full:'dominant 7th',iv:[0,4,7,10]}};
const chordNotes=(r,q)=>Q[q].iv.map((s,i)=>spell(r,i*2,s));
const chordName=(r,q)=>`${nm(r)} ${Q[q].full}`;
const MAJ_SHARP=['C','G','D','A','E','B','F#','C#'],MAJ_FLAT=['C','F','Bb','Eb','Ab','Db','Gb','Cb'];
const MIN_SHARP=['A','E','B','F#','C#','G#','D#','A#'],MIN_FLAT=['A','D','G','C','F','Bb','Eb','Ab'];
const keyOf=n=>{const i=Math.abs(n);return{n,maj:n>=0?MAJ_SHARP[i]:MAJ_FLAT[i],min:n>=0?MIN_SHARP[i]:MIN_FLAT[i]}};
const SHARP_ORDER=[3,0,4,1,5,2,6],FLAT_ORDER=[6,2,5,1,4,0,3];
const keyAcc=(l,n)=>n>0&&SHARP_ORDER.slice(0,n).includes(l)?1:n<0&&FLAT_ORDER.slice(0,-n).includes(l)?-1:0;
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const cap=s=>s[0].toUpperCase()+s.slice(1);
const voicing=notes=>{const r=48+pc(notes[0]);const b=midiOf(notes[0]);return notes.map(n=>r+(midiOf(n)-b))};
function qualityOf(notes){const b=midiOf(notes[0]);const s=notes.slice(1).map(n=>midiOf(n)-b).join();return{'4,7':'maj','3,7':'min','3,6':'dim','4,8':'aug'}[s]}
// intervals
const QN={m:'Minor',M:'Major',P:'Perfect',A:'Augmented',d:'Diminished'};
const ORD=['unison','2nd','3rd','4th','5th','6th','7th','octave','9th','10th','11th','12th'];
const ivName=iv=>`${QN[iv[0][0]]} ${ORD[iv[1]]}`;
const IV_BASIC=[['m2',1,1],['M2',1,2],['m3',2,3],['M3',2,4],['P4',3,5],['P5',4,7],['m6',5,8],['M6',5,9],['m7',6,10],['M7',6,11],['P8',7,12]];
const IV_ADV=[['A4',3,6],['d5',4,6],['A2',1,3],['d7',6,9],['A5',4,8],['d4',3,4],['A6',5,10],['m9',8,13],['M9',8,14],['m10',9,15],['M10',9,16],['P11',10,17],['P12',11,19]];
// harmony
function diatonic(tonic,mode,deg){
  const iv=mode==='maj'?SCALES.major.iv:SCALES.natural.iv;
  const t=parseN(tonic,4);
  return[0,2,4].map(k=>{const kk=deg+k;let n=spell(t,kk,iv[kk%7]+12*Math.floor(kk/7));if(mode!=='maj'&&kk%7===6&&(deg===4||deg===6))n={...n,a:n.a+1};return n});
}
const NUM_MAJ=['I','ii','iii','IV','V','vi','vii°'],NUM_MIN=['i','ii°','III','iv','V','VI','vii°'];
// THEORY END

const TOPICS=[
 {id:'geo',name:'Find the key',blurb:'Find every note, sharps and flats included, before the timer runs out.',levels:['Relaxed: 10 seconds','Steady: 6 seconds','Brisk: 4 seconds','Quick: 3 seconds','Fast: 2 seconds','Expert: 1.4 seconds','Professional: 0.8 seconds']},
 {id:'read',name:'Read the staff',blurb:'See a note on the staff, find it on the keys before the timer runs out.',levels:['Treble clef: 10 seconds','Bass clef: 10 seconds','Ledger lines: 8 seconds','Sharps and flats: 8 seconds','Everything: 5 seconds','Everything: 3 seconds','Everything: 2 seconds','Expert: 1.5 seconds','Professional: 1 second']},
 {id:'acc',name:'Accidentals in context',blurb:'Work out the real note from key signatures, the bar rule and its exceptions.',levels:['Key signature in action','Accidentals last the bar','Octaves, reminders and doubles','Clef changes and everything']},
 {id:'values',name:'Note values and time',blurb:'Note and rest lengths, dots, ties, time signatures and beaming.',levels:['Notes and rests','Dots and ties','Time signatures','Complete the bar','Beaming, triplets and 6/8']},
 {id:'tap',name:'Rhythm tapping',blurb:'Read a rhythm and tap it in time with the metronome.',levels:['Whole, half and quarter','Rests and 3/4','Eighth notes','Dotted rhythms and ties','Sixteenth notes','Triplets and 6/8','Syncopation']},
 {id:'marks',name:'Dynamics and expression',blurb:'Loud and soft, articulation, tempo and Italian terms.',levels:['Dynamics','Articulation','Tempo','Expression terms','Everything mixed']},

}

function voiceLead(chords){
  let prev=null;return chords.map(ns=>{
    const pcs=ns.map(pc),root=pcs[0];let bass=36+root;if(bass<40)bass+=12;
    const cands=[];for(let inv=0;inv<3;inv++){const r=pcs.slice(inv).concat(pcs.slice(0,inv));for(let s=55;s<=67;s++){if(s%12!==r[0])continue;const v=[s];for(let k=1;k<3;k++){let m=v[k-1]+1;while(m%12!==r[k])m++;v.push(m)}cands.push(v)}}
    let best=cands[0],bs=1e9;
    cands.forEach(v=>{const sc=prev?v.reduce((a,m,i)=>a+Math.abs(m-prev[i]),0):Math.abs(v[0]-(60+root))+(v[0]%12===root?0:6);if(sc<bs){bs=sc;best=v}});

}

  const cEl=app.querySelector('#count');
  for(let i=0;i<cnt;i++)S.timers.push(setTimeout(()=>{if(cEl)cEl.textContent=String(i+1)},(lead+i*q.beat*spq)*1000));
  S.timers.push(setTimeout(()=>{if(cEl)cEl.textContent=withTaps?'Tap!':'♪'},start*1000));
  S.timers.push(setTimeout(()=>{if(cEl&&!withTaps)cEl.textContent=''},(start+q.total*spq+.3)*1000));
  const lat=(AC.outputLatency||AC.baseLatency||0);
  return{spq,start,perf0:performance.now()+(start+.02+lat)*1000};
}
function startTapping(){
  if(S.started)return;S.started=true;
  const q=S.q,r=rhythmRun(true);if(!r)return;
  S.taps=[];S.rt=r;
  app.querySelector('#start').disabled=true;app.querySelector('#listen').disabled=true;
  const pad=app.querySelector('#pad');pad.disabled=false;
  S.timers.push(setTimeout(evalRhythm,(r.start+q.total*r.spq+.45)*1000));
}
function padTap(ts){
  if(!S||!S.taps||S.answered)return;
  const t=((ts>0?ts:performance.now())-S.rt.perf0)/1000/S.rt.spq;
  if(t<-.6)return;
  S.taps.push(t);if(AC)tone(84,0,.15,.12);
  const pad=app.querySelector('#pad');pad.classList.add('hit');setTimeout(()=>pad.classList.remove('hit'),90);
}
function evalRhythm(){
  if(!S||S.answered)return;
  const q=S.q,spq=S.rt.spq,tol=Math.min(.17,Math.max(.1,.16*spq))/spq;
  const used=new Set();let hits=0;const hitIdx=[];
  q.onsets.forEach(o=>{let best=-1,bd=1e9;S.taps.forEach((t,i)=>{if(used.has(i))return;const d=Math.abs(t-o);if(d<bd){bd=d;best=i}});if(best>=0&&bd<=tol){used.add(best);hits++;hitIdx.push(true)}else hitIdx.push(false)});
  const extra=S.taps.length-used.size;
  // map onsets to event indexes
  let t=0,prevTie=false,k=0;q.evs.forEach((e,i)=>{if(e.bar)return;if(!e.rest&&!prevTie){const m=app.querySelector(`.mk[data-i="${i}"]`);if(m)m.classList.add(hitIdx[k]?'ok':'bad');k++}else if(!e.rest){const m=app.querySelector(`.mk[data-i="${i}"]`);if(m)m.remove()}prevTie=!!e.tie&&!e.rest;t+=e.d});
  const ok=hits===q.onsets.length&&extra===0;
  q.answerText=`${hits} of ${q.onsets.length} notes on time${extra?`, ${extra} extra tap${extra>1?'s':''}`:''}. Press Listen to hear it.`;
  app.querySelector('#pad').disabled=true;app.querySelector('#listen').disabled=false;
  const c=app.querySelector('#count');if(c)c.textContent='';
  finish(ok);
}
function onKey(m){
  const q=S&&S.q;if(!q||S.answered)return;
  const p=m%12,dm=disp(m);
  if(q.type==='tap'){
    const ok=q.pcs.includes(p);
    mark(S.kb,[dm],ok?'ok':'bad');if(!ok)markPc(S.kb,q.pcs,'want');
    finish(ok);
  }else if(q.type==='seq'){
    const exp=pc(q.notes[S.si]),chip=app.querySelector(`.chip[data-i="${S.si}"]`);
    const top=S.si===q.notes.length-1,low=top&&p===exp&&S.lastM!==undefined&&m<=S.lastM;
    if(low)q.answerText+='. Finish on the tonic an octave above where you started.';
    if(p===exp&&!low){S.lastM=m;mark(S.kb,[dm],'ok');chip.textContent=nm(q.notes[S.si]);chip.classList.add('ok');S.si++;
      const nx=app.querySelector(`.chip[data-i="${S.si}"]`);if(nx)nx.textContent='?';
      if(S.si===q.notes.length)finish(true);}
    else{mark(S.kb,[dm],'bad');
      for(let i=S.si;i<q.notes.length;i++){const c=app.querySelector(`.chip[data-i="${i}"]`);c.textContent=nm(q.notes[i]);c.classList.add('want')}
      markPc(S.kb,q.notes.slice(S.si).map(pc),'want');finish(false);}
  }else if(q.type==='set'){
    m=dm;const b=S.kb.querySelector(`[data-m="${m}"]`);
    if(S.sel.has(m)){S.sel.delete(m);b.classList.remove('sel')}else{S.sel.add(m);b.classList.add('sel')}
    app.querySelector('#check').disabled=S.sel.size!==q.notes.length;
  }
}
function checkSet(){
  const q=S.q;if(S.answered)return;
  const want=new Set(q.notes.map(pc)),got=new Set([...S.sel].map(m=>m%12));
  const ok=want.size===got.size&&[...want].every(x=>got.has(x));
  clearKb(S.kb);
  [...S.sel].forEach(m=>mark(S.kb,[m],want.has(m%12)?'ok':'bad'));
  if(!ok)mark(S.kb,q.reveal.filter(m=>![...S.sel].some(s=>s%12===m%12)),'want');
  playNotes(ok?[...S.sel].sort((a,b)=>a-b):q.reveal);
  finish(ok);
}
function onChoice(btn){
  const q=S.q;if(S.answered)return;
  const ok=btn.textContent===q.answer;
  btn.classList.add(ok?'ok':'bad');
  if(!ok)app.querySelectorAll('.choice').forEach(b=>{if(b.textContent===q.answer)b.classList.add('ok')});
  if(q.reveal)mark(S.kb,q.reveal,'want');
  finish(ok);
}
function finish(ok){
  S.answered=true;const q=S.q;
  S.streak=ok?S.streak+1:0;S.best=Math.max(S.best,S.streak);
  const gained=ok?Math.round(10*q.level*(1+Math.min(S.streak-1,10)*.1)):0;
  S.xp+=gained;S.res.push(ok);
  record(q,ok,gained);
  const fb=app.querySelector('#fb');fb.className='fb '+(ok?'ok':'bad');
  fb.textContent=ok?`Correct! +${gained} XP`:`${q.timedOut?'Time’s up.':'Not quite.'} ${q.answerText}`;
  app.querySelector('#combo').textContent=S.streak>=2?`🔥 ×${S.streak}`:'';
  const dots=app.querySelectorAll('.dots i');dots[S.i].className=ok?'ok':'bad';
  S.i++;
  const act=app.querySelector('#actions');
  act.innerHTML=`<button class="btn wide" id="next">${S.i>=ROUND?'See results':'Next'}</button>`;
  act.querySelector('#next').onclick=nextQuestion;
  act.querySelector('#next').focus({preventScroll:true});
  const longRead=q.type==='mc'&&(q.topic==='marks'||q.topic==='signs');
  if(ok&&S.i<ROUND&&q.type!=='rhythm'&&!q.chords)autoT=setTimeout(()=>{if(S&&S.answered)nextQuestion()},longRead?1700:q.time?650:1300);
}
function record(q,ok,gained){
  const t=tp(q.topic),lv=lvOf(q.topic,q.level);
  lv.att++;if(ok)lv.cor++;lv.recent.push(ok?1:0);if(lv.recent.length>WINDOW)lv.recent.shift();
  const it=state.items[q.item]||(state.items[q.item]={s:0,m:0});it.s++;if(!ok)it.m++;else it.m=Math.max(0,it.m-.5);
  const dk=dayKey();state.days[dk]=(state.days[dk]||0)+1;
  state.xp+=gained;
  const max=TOPIC[q.topic].levels.length;
  if(q.level===t.unlocked&&t.unlocked<max&&recentSum(q.topic,q.level)>=NEED){
    t.unlocked++;S.unlocks.push(`${TOPIC[q.topic].name} level ${t.unlocked}: ${TOPIC[q.topic].levels[t.unlocked-1]}`);
    toast(`🔓 Unlocked ${TOPIC[q.topic].name} level ${t.unlocked}`);
  }
  checkBadges();save();
}
const BADGES=[
 {id:'first',e:'🎵',n:'First note',d:'Answer your first question right',f:()=>Object.values(state.topics).some(t=>Object.values(t.lv).some(l=>l.cor>0))},
 {id:'hot',e:'🔥',n:'On fire',d:'10 right in a row',f:()=>S&&S.best>=10},
 {id:'perfect',e:'💯',n:'Perfect round',d:'Score 10 out of 10',f:()=>S&&S.res.length===ROUND&&S.res.every(Boolean)},
 {id:'groove',e:'🥁',n:'In the groove',d:'Tap 5 rhythms perfectly',f:()=>Object.values(tp('tap').lv).reduce((a,l)=>a+l.cor,0)>=5},
 {id:'day3',e:'📅',n:'Habit forming',d:'Practise 3 days in a row',f:()=>dayStreak()>=3},
 {id:'day7',e:'🗓️',n:'Week strong',d:'Practise 7 days in a row',f:()=>dayStreak()>=7},
 {id:'rounded',e:'🎹',n:'Well rounded',d:'Answer in every topic',f:()=>TOPICS.every(t=>state.topics[t.id]&&Object.values(state.topics[t.id].lv).some(l=>l.att>0))},
 {id:'xp1k',e:'⭐',n:'1,000 XP',d:'Earn 1,000 XP',f:()=>state.xp>=1000},
 {id:'xp5k',e:'🌟',n:'5,000 XP',d:'Earn 5,000 XP',f:()=>state.xp>=5000},
 {id:'top',e:'🏆',n:'Top of the class',d:'Unlock the last level of a topic',f:()=>TOPICS.some(t=>tp(t.id).unlocked===t.levels.length)},
 {id:'reader',e:'📜',n:'Sight reader',d:'Unlock the last level of every notation topic',f:()=>SECTIONS[1][1].every(id=>tp(id).unlocked===TOPIC[id].levels.length)},
];
function checkBadges(){BADGES.forEach(b=>{if(!state.badges[b.id]&&b.f()){state.badges[b.id]=Date.now();toast(`${b.e} Badge earned: ${b.n}`)}})}
function showResults(){
  S.timers.forEach(clearTimeout);stopAudio();clearTimeout(autoT);checkBadges();save();
  const right=S.res.filter(Boolean).length,topic=S.topic,level=S.level;
  const back=topic==='mix'?'Back to topics':`Back to ${TOPIC[topic].name}`;
  app.innerHTML=`<div class="res">
    <div class="muted">${topic==='mix'?'Mixed review':`${TOPIC[topic].name}, level ${level}`}</div>
    <div class="big">${right}/${S.res.length}</div>
    <div class="xp">+${S.xp} XP</div>
    ${S.best>=3?`<div class="muted">Best run: ${S.best} in a row</div>`:''}
  </div>
  ${S.unlocks.map(u=>`<div class="banner"><b>🔓 New level unlocked</b>${u}</div>`).join('')}
  ${topic!=='mix'?`<div class="box"><h3>Level progress</h3><div class="bar ok"><i style="width:${Math.min(1,recentSum(topic,tp(topic).unlocked)/NEED)*100}%"></i></div><div class="muted" style="font-size:.92rem">${masteryLine(topic)}</div></div>`:''}
  <div style="display:flex;flex-direction:column;gap:8px">
    <button class="btn wide" id="again">${S.unlocks.length&&topic!=='mix'?`Try level ${tp(topic).unlocked}`:'Play again'}</button>
    <button class="btn wide ghost" id="home">${back}</button>
  </div>`;
  const lvlNext=S.unlocks.length&&topic!=='mix'?tp(topic).unlocked:level;
  app.querySelector('#again').onclick=()=>startSession(topic,lvlNext);
  app.querySelector('#home').onclick=()=>topic==='mix'?route():viewTopic(topic);
  S=null;window.scrollTo(0,0);
}

/* ---------- guide ---------- */
function viewGuide(){
  const row=(svg,n,m)=>`<div class="grow"><div>${svg}</div><div><div class="gn">${n}</div><div class="gm">${m}</div></div></div>`;
  const accs=[['♯','Sharp','Raise the note a half step'],['♭','Flat','Lower the note a half step'],['♮','Natural','Cancel a sharp or flat'],['𝄪','Double sharp','Raise the note two half steps'],['𝄫','Double flat','Lower the note two half steps']];
  const sec=(title,body)=>`<section class="gsec"><h2>${title}</h2>${body}</section>`;
  app.innerHTML=`${topBar('Guide')}<div class="guide">
  <p class="muted" style="margin:0 0 14px">Everything the trainer tests, in one place. Quarter note = 1 beat unless the time signature says otherwise.</p>
  ${sec('Notes and rests',VAL.map(v=>row(rhythmSVG([v.e]),v.n,`${beatsLabel(v.b)} in 4/4`)).join(''))}
  ${sec('Dots and ties',DOTS.map(d=>row(rhythmSVG(d.ev),d.n,beatsLabel(d.b))).join('')+'<p>A dot adds half the note’s value. A second dot adds half of that again. A tie joins two notes of the same pitch into one longer note.</p>')}
  ${sec('Time signatures',TS_LIST.map(t=>row(tsSVG(t[0]),t[0]==='C'?'Common time':t[0]==='¢'?'Cut time':t[0],t[1])).join('')+'<p>Top number: how many beats in a bar. Bottom number: which note gets the beat (4 = quarter, 2 = half, 8 = eighth). When the top is 6, 9 or 12 over 8, it’s compound time: count in dotted-quarter beats, with eighths grouped in threes.</p>')}
  ${sec('Rhythm extras',row(rhythmSVG(CELLS.trip),'Triplet','Three notes in the time of two')+row(rhythmSVG(CELLS.syn),'Syncopation','Accent falls between the beats')+row(rhythmSVG(CELLS.eds),'Dotted eighth and sixteenth','A long-short “skipping” rhythm')+'<p>Beams join eighths and shorter notes within one beat, so you can see where each beat starts.</p>')}
  ${sec('Accidentals',accs.map(a=>row(SV(TX(75,52,a[0],'mus',40)),a[1],a[2])).join('')+`<p><b>The bar rule:</b> an accidental lasts until the end of the bar, for that exact line or space.</p><p><b>Barlines cancel</b> accidentals, except a note tied across the barline keeps its accidental.</p><p><b>Other octaves</b> aren’t affected by an accidental, though editors often add a reminder.</p><p><b>Courtesy accidentals</b> in brackets are just reminders and don’t change anything.</p><p><b>Key signatures</b> apply to every octave for the whole piece until a new key signature appears.</p>`)}
  ${Object.entries(SYM_CATS).map(([c,t])=>sec(t,SYMBOLS.filter(s=>s.c===c).map(s=>row(s.s,s.n,s.m)).join('')+(c==='rep'?'<p>Reading order: follow repeats and endings first. After D.C. or D.S., repeats are usually skipped, and you stop at Fine or jump at “To Coda”.</p>':'')+(c==='orn'?'<p>Ornament details vary by period. In Baroque and Classical music trills usually start on the note above; from the Romantic period on, they usually start on the written note.</p>':''))).join('')}
  </div>`;
  bindTop();
}

/* ---------- progress ---------- */
function viewProgress(){
  const days=[];const end=new Date();const start=new Date();start.setDate(end.getDate()-83-end.getDay());
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){const c=state.days[dayKey(d)]||0;days.push(`<i class="${c===0?'':c<10?'h1':c<30?'h2':c<60?'h3':'h4'}" title="${dayKey(d)}: ${c}"></i>`)}
  const total=Object.values(state.days).reduce((a,b)=>a+b,0);
  const weak=Object.entries(state.items).filter(([,v])=>v.s>=2&&v.m>=1).map(([k,v])=>[k,v.m/(v.s+1)]).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const tstat=t=>{let a=0,c=0;Object.values(tp(t.id).lv).forEach(l=>{a+=l.att;c+=l.cor});const p=a?Math.round(c/a*100):0;
    return `<div class="stat"><span>${t.name} <span class="muted">(level ${tp(t.id).unlocked}/${t.levels.length})</span></span><b>${a?p+'%':'–'}</b><div class="bar thin ok"><i style="width:${p}%"></i></div></div>`};
  app.innerHTML=`${topBar('Progress')}
  <div class="box"><h3>Practice in the last 12 weeks</h3><div class="heat">${days.join('')}</div>
    <div class="meta" style="margin-top:10px"><span><b>${total}</b> answers all time</span><span>🔥 <b>${dayStreak()}</b> day streak</span><span><b>${state.xp}</b> XP</span></div></div>
  <div class="box"><h3>Accuracy by topic</h3>${SECTIONS.map(([n,ids])=>`<div class="sec-h" style="margin:10px 0 6px">${n}</div>${ids.map(id=>tstat(TOPIC[id])).join('')}`).join('')}</div>
  <div class="box"><h3>Needs work</h3>${weak.length?`<ul class="weak">${weak.map(([k,r])=>`<li><span>${k}</span><span class="muted">${Math.round(r*100)}% missed</span></li>`).join('')}</ul><p class="note" style="margin-top:8px">These come up more often until you get them right.</p>`:'<p class="muted" style="margin:0">Nothing yet. Things you miss will show up here and appear more often in practice.</p>'}</div>
  <div class="box"><h3>Badges</h3><div class="badges">${BADGES.map(b=>`<div class="badge ${state.badges[b.id]?'':'off'}"><span class="e">${b.e}</span><b>${b.n}</b><div class="muted">${b.d}</div></div>`).join('')}</div></div>
  <button class="btn wide ghost" id="reset">Reset all progress</button>`;
  bindTop();
  app.querySelector('#reset').onclick=()=>{if(confirm('Reset all progress? This clears XP, levels, streaks and badges.')){state=Object.assign(fresh(),{settings:state.settings});save();route()}};
}

/* ---------- MIDI input ---------- */
const MIDI={access:null,status:'off',names:[]};
const disp=m=>m>=KB_LO&&m<=KB_HI?m:KB_LO+(((m-KB_LO)%24)+24)%24;
function bindMidi(){
  if(!MIDI.access)return;
  MIDI.names=[];MIDI.nOut=0;
  for(const inp of MIDI.access.inputs.values()){inp.onmidimessage=onMidi;try{inp.open&&inp.open()}catch(e){}MIDI.names.push(inp.name||'MIDI input')}
  for(const o of MIDI.access.outputs.values())MIDI.nOut++;
  MIDI.status=MIDI.names.length?'ready':'none';updMidiUI();
  clearTimeout(MIDI.poll);if(MIDI.status==='none'&&state.settings.input==='midi')MIDI.poll=setTimeout(bindMidi,2000);
}
async function initMidi(force){
  if(MIDI.access&&!force){bindMidi();return true}
  if(!navigator.requestMIDIAccess){MIDI.status='unsupported';updMidiUI();return false}
  MIDI.status='off';updMidiUI();
  try{MIDI.access=await navigator.requestMIDIAccess({sysex:false})}catch(e){MIDI.status='denied';MIDI.err=(e&&(e.name||e.message))||'unknown';updMidiUI();return false}
  MIDI.access.onstatechange=()=>bindMidi();
  bindMidi();setTimeout(bindMidi,600);return true;
}
function onMidi(e){
  const d=e.data;if(!d||d.length<3||(d[0]&0xf0)!==0x90||!d[2])return;
  if(state.settings.input!=='midi')return;
  const n=d[1],flash=kb=>{const b=kb&&kb.querySelector(`[data-m="${disp(n)}"]`);if(b){b.classList.add('down');setTimeout(()=>b.classList.remove('down'),160)}};
  if(S&&S.q){if(S.q.type==='rhythm'){padTap(e.timeStamp);return}flash(S.kb);onKey(n);return}
  flash(app.querySelector('.kb'));
}
function midiText(){
  if(state.settings.input!=='midi')return'';
  return{off:'Connecting to your MIDI keyboard…',unsupported:'This browser can’t read MIDI. Use Chrome or Edge on a computer or Android.',denied:`MIDI access was blocked (${MIDI.err}). If you’re viewing this inside Claude, open the downloaded file in Chrome instead.`,none:`No MIDI keyboard found yet (Chrome sees ${MIDI.names.length} inputs, ${MIDI.nOut||0} outputs). Close other tabs or apps using the piano, unplug and replug it, then press Scan again. Still checking…`,ready:`Connected: ${MIDI.names.join(', ')}`}[MIDI.status];
}
function updMidiUI(){document.querySelectorAll('.midistat').forEach(el=>el.textContent=midiText())}
function applyInputMode(){
  const midi=state.settings.input==='midi';
  const w=app.querySelector('#pad')?app.querySelector('.kbwrap'):null;if(w)w.classList.toggle('small',midi);
  const t=app.querySelector('#inmode');if(t){t.textContent=midi?'🎹 MIDI':'📱 Screen';t.setAttribute('aria-label',`Input: ${midi?'MIDI keyboard':'on-screen keyboard'}. Switch input`)}
  const pad=app.querySelector('#pad');if(pad)pad.textContent=midi?'Tap here or play any key':'Tap';
  updMidiUI();
}
function setInput(v){state.settings.input=v;save();if(v==='midi')initMidi();applyInputMode()}
function viewSettings(){
  const midi=state.settings.input==='midi';
  app.innerHTML=`${topBar('Settings')}
  <div class="box"><h3>Input method</h3>
    <div class="seg" role="radiogroup" aria-label="Input method">
      <button class="segb ${midi?'':'on'}" data-in="screen" role="radio" aria-checked="${!midi}">On-screen keyboard</button>
      <button class="segb ${midi?'on':''}" data-in="midi" role="radio" aria-checked="${midi}">MIDI keyboard</button>
    </div>
    <p class="midistat"></p>
    ${midi?'<button class="btn ghost" id="rescan" style="margin-top:10px">Scan again</button>':''}
    <p class="note">With MIDI, answer on your real piano in any octave and tap rhythms on any key. The on-screen keyboard shrinks but still works. You can also switch from the button at the top of any practice round. MIDI works in Chrome and Edge on a computer or Android, not on iPhone or iPad.</p>
  </div>`;
  bindTop();
  app.querySelectorAll('[data-in]').forEach(b=>b.onclick=()=>{setInput(b.dataset.in);viewSettings()});
  const rs=app.querySelector('#rescan');if(rs)rs.onclick=()=>initMidi(true);
  updMidiUI();
}

if(state.settings.input==='midi')initMidi();
route();
initDb();
</script>
